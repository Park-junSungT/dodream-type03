<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Distilled from the DoDream brand artwork: a cane that senses what is ahead.
    The poster carries the wordmark, the tagline and a braille line as well, but
    at 16px only one idea survives, so this keeps the strongest one — the grip
    module, the shaft, and the sensing arcs leaving it.

    Ground, ink and copper are the brand's own: the cream matches --stage-bg
    and the accent matches --stage-accent.
  -->
  <rect width="64" height="64" rx="14" fill="#F7F2EC" />

  <g
    stroke="#A36944"
    stroke-width="3.4"
    stroke-linecap="round"
    fill="none"
  >
    <path d="M38.92 13.45A11 11 0 0 1 38.92 30.55" />
    <path d="M25.08 13.45A11 11 0 0 0 25.08 30.55" />
    <path d="M45.21 10.52A17.5 17.5 0 0 1 45.21 33.48" />
    <path d="M18.79 10.52A17.5 17.5 0 0 0 18.79 33.48" />
  </g>

  <rect x="28.2" y="11.6" width="7.6" height="18" rx="3.8" fill="#141E29" />
  <path
    d="M32 27.5V47.4"
    stroke="#141E29"
    stroke-width="3.8"
    stroke-linecap="round"
  />
  <rect x="28.7" y="46.8" width="6.6" height="7.2" rx="3.3" fill="#A36944" />
</svg>
